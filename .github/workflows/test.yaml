name: Terraform

on:

  # =========================================================
  # PUSH
  # Run KICS + Terraform Plan on pushes to ANY branch
  # =========================================================
  push:
    paths-ignore:
      - CHANGELOG.md

  # =========================================================
  # PULL REQUEST
  # Run KICS + Terraform Plan for PRs targeting ANY branch
  # =========================================================
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - CHANGELOG.md


# ===========================================================
# WORKFLOW-LEVEL PERMISSIONS
# ===========================================================
permissions:
  contents: read
  security-events: write
  actions: read


jobs:

  # =========================================================
  # KICS
  # =========================================================
  kics:
    name: KICS

    # Do not run for Dependabot
    if: github.actor != 'dependabot[bot]'

    uses: ./.github/workflows/kics.yaml

    with:
      cloud-provider: azure
      gh_runner: ubuntu-latest


  # =========================================================
  # TERRAFORM PLAN
  #
  # Runs on whichever branch/event triggered the workflow.
  #
  # Examples:
  #   feature/abc -> Plan
  #   develop     -> Plan
  #   main        -> Plan
  #
  # Plan does NOT require the branch to be main.
  # =========================================================
  plan:
    name: Terraform Plan

    # KICS must pass before Plan starts
    needs: kics

    # Do not run for Dependabot
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AZURE_CORE_COLLECT_TELEMETRY: "false"

    steps:

      # -------------------------------------------------------
      # Checkout
      #
      # For PR:
      #   Checkout actual PR source commit
      #
      # For push:
      #   Checkout pushed commit
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}


      # -------------------------------------------------------
      # Setup Terraform
      # -------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.3"


      # -------------------------------------------------------
      # Terraform Format Check
      # -------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # -------------------------------------------------------
      # Azure Login using OIDC
      # -------------------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}


      # -------------------------------------------------------
      # Terraform Init
      # -------------------------------------------------------
      - name: Terraform Init
        run: terraform init


      # -------------------------------------------------------
      # Terraform Validate
      # -------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate


      # -------------------------------------------------------
      # Terraform Plan
      # -------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfplan


      # -------------------------------------------------------
      # Encrypt Terraform Plan
      # -------------------------------------------------------
      - name: Encrypt Terraform Plan
        run: |
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.TF_GPG_PASSPHRASE }}" \
            --symmetric \
            --cipher-algo AES256 \
            tfplan

          rm tfplan


      # -------------------------------------------------------
      # Upload Encrypted Terraform Plan
      # -------------------------------------------------------
      - name: Upload Encrypted Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: tfplan.gpg
          retention-days: 1


  # =========================================================
  # TERRAFORM APPLY
  #
  # Apply ONLY runs when:
  #
  #   1. KICS passed
  #   2. Terraform Plan passed
  #   3. Event is PUSH
  #   4. Branch is MAIN
  #   5. Actor is not Dependabot
  #
  # Therefore:
  #
  #   feature/abc -> NO APPLY
  #   develop     -> NO APPLY
  #   release/*   -> NO APPLY
  #   main        -> APPLY
  # =========================================================
  apply:
    name: Terraform Apply

    # Terraform Plan must succeed
    needs: plan

    if: |
      github.actor != 'dependabot[bot]' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AZURE_CORE_COLLECT_TELEMETRY: "false"

    steps:

      # -------------------------------------------------------
      # Checkout MAIN
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Setup Terraform
      # -------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.3"


      # -------------------------------------------------------
      # Terraform Format Check
      # -------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # -------------------------------------------------------
      # Azure Login using OIDC
      # -------------------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}


      # -------------------------------------------------------
      # Terraform Init
      # -------------------------------------------------------
      - name: Terraform Init
        run: terraform init


      # -------------------------------------------------------
      # Create fresh Terraform plan on MAIN
      # -------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfmergeplan


      # -------------------------------------------------------
      # Terraform Apply
      # -------------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve tfmergeplan