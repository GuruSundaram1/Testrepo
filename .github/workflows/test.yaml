name: Terraform

on:
  # ======================================================
  # 1. PUSH
  #    Runs on all branches, including main
  #    Skips the workflow when only CHANGELOG.md changes
  # ======================================================
  push:
    paths-ignore:
      - CHANGELOG.md

  # ======================================================
  # 2. PULL REQUEST
  #    Runs when PR targets main
  # ======================================================
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - CHANGELOG.md


# =========================================================
# DEFAULT PERMISSIONS
# =========================================================
permissions:
  contents: read
  security-events: write
  actions: read


jobs:

  # ======================================================
  # 1. KICS SECURITY SCAN
  # ======================================================
  kics:
    name: KICS

    if: github.actor != 'dependabot[bot]'

    uses: ./.github/workflows/kics.yaml

    with:
      image-version: v1.6.10-alpine
      cloud-provider: azure
      gh_runner: ubuntu-latest


  # ======================================================
  # 2. TERRAFORM PLAN
  #
  # Runs on:
  #   - Pull Requests targeting main
  #   - Push to feature/non-main branches
  #   - Push to main after PR merge
  # ======================================================
  plan:
    name: Terraform Plan

    needs: kics

    # Plan runs for all supported events.
    # Apply is separately restricted to main.
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest

    # ====================================================
    # OIDC permission required for Azure authentication
    # ====================================================
    permissions:
      id-token: write
      contents: read

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

      TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      AZURE_CORE_COLLECT_TELEMETRY: "false"

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.3"


      # --------------------------------------------------
      # Terraform Format Check
      # --------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # --------------------------------------------------
      # Azure Login using OIDC
      # --------------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}


      # --------------------------------------------------
      # Terraform Init
      # --------------------------------------------------
      - name: Terraform Init
        run: terraform init


      # --------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------
      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfplan


      # ==================================================
      # Encrypt Terraform Plan
      # ==================================================
      - name: Encrypt Terraform Plan
        run: |
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${{ secrets.TF_GPG_PASSPHRASE }}" \
              --symmetric --cipher-algo AES256 tfplan

          rm tfplan


      # --------------------------------------------------
      # Upload encrypted Terraform Plan
      # --------------------------------------------------
      - name: Upload Encrypted Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: tfplan.gpg
          retention-days: 1


  # ======================================================
  # 3. TERRAFORM APPLY
  #
  # Runs ONLY after:
  #   - Push to main
  #   - Terraform Plan succeeds
  #
  # This happens after the PR is merged to main.
  # ======================================================
  apply:
    name: Terraform Apply

    needs: plan

    if: |
      github.actor != 'dependabot[bot]' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # ====================================================
    # OIDC permission required for Azure authentication
    # ====================================================
    permissions:
      id-token: write
      contents: read

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

      TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      AZURE_CORE_COLLECT_TELEMETRY: "false"

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.3"


      # --------------------------------------------------
      # Terraform Format Check
      # --------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # --------------------------------------------------
      # Azure Login using OIDC
      # --------------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}


      # --------------------------------------------------
      # Terraform Init
      # --------------------------------------------------
      - name: Terraform Init
        run: terraform init


      # --------------------------------------------------
      # Generate a fresh plan on main
      #
      # This is intentionally a new plan.
      # The PR plan artifact is NOT used for Apply.
      # --------------------------------------------------
      - name: Terraform Plan - Merge Stage
        run: terraform plan -out=tfmergeplan


      # --------------------------------------------------
      # Apply the exact plan generated above
      # --------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve tfmergeplan
