name: Terraform

on:
  # 1. Push to ANY branch (including main)
  push:
    paths-ignore:
      - CHANGELOG.md

  # 2. Pull Requests targeting main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - CHANGELOG.md

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  # ======================================================
  # 1. KICS SECURITY SCAN (reusable workflow)
  # ======================================================
  kics:
    name: KICS
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/kics.yaml
    with:
      image-version: v1.6.10-alpine
      cloud-provider: azure
      gh_runner: ubuntu-latest

  # ======================================================
  # 2. TERRAFORM PLAN
  #    Runs on:
  #    - Pull Requests (PRs) targeting main
  #    - Push to any branch EXCEPT main
  # ======================================================
  plan:
    name: Terraform Plan
    needs: kics
    if: |
      github.actor != 'dependabot[bot]' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref != 'refs/heads/main')
      )
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AZURE_CORE_COLLECT_TELEMETRY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.3"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (Staging)
        run: terraform plan -out=tfplan

      # 🔐 ENCRYPT the plan file before uploading
      # Uses the TF_GPG_PASSPHRASE secret (must be set in repository)
      - name: Encrypt Terraform Plan
        run: |
          # If the secret is not set, this will fail. Ensure you have set it.
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${{ secrets.TF_GPG_PASSPHRASE }}" \
              --symmetric --cipher-algo AES256 tfplan
          rm tfplan  # Remove unencrypted file

      - name: Upload Encrypted Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: tfplan.gpg
          retention-days: 1

  # ======================================================
  # 3. TERRAFORM APPLY (runs only on push to main – after merge)
  # ======================================================
  apply:
    name: Terraform Apply
    needs: plan
    if: github.actor != 'dependabot[bot]' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AZURE_CORE_COLLECT_TELEMETRY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.3"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      # --------------------------------------------------------------------
      # Option A: Apply the reviewed plan (recommended for production)
      # Uncomment the following steps and comment out Option B.
      # --------------------------------------------------------------------
      # - name: Download Encrypted Plan
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: terraform-plan-${{ github.sha }}
      #     path: .
      #     # Note: This downloads the artifact from the *same* run.
      #     # For cross-run downloads, use a `workflow_run` trigger (see advanced).
      #
      # - name: Decrypt Plan
      #   run: |
      #     gpg --batch --yes --pinentry-mode loopback \
      #         --passphrase "${{ secrets.TF_GPG_PASSPHRASE }}" \
      #         --decrypt tfplan.gpg > tfplan
      #
      # - name: Terraform Apply
      #   run: terraform apply -auto-approve tfplan
      # --------------------------------------------------------------------

      # --------------------------------------------------------------------
      # Option B: Re‑run plan and apply (simpler, used by default)
      # This is what the current workflow does.
      # --------------------------------------------------------------------
      - name: Terraform Plan (Merge Stage)
        run: terraform plan -out=tfmergeplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfmergeplan
      # -------------------------------------------------