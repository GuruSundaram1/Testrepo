name: Terraform

on:
  # 1. Triggers when code is merged to main (push after PR merge)
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md

  # 2. Triggers on PR activity
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - CHANGELOG.md

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  # ======================================================
  # 1. KICS SECURITY SCAN (reusable workflow)
  # ======================================================
  kics:
    name: KICS
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/kics.yaml
    with:
      image-version: v1.6.10-alpine
      cloud-provider: azure
      gh_runner: ubuntu-latest

  # ======================================================
  # 2. TERRAFORM PLAN (runs only on Pull Requests)
  # ======================================================
  plan:
    name: Terraform Plan
    needs: kics
    if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AZURE_CORE_COLLECT_TELEMETRY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.3"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (Staging)
        run: terraform plan -out=tfplan

      # 🔐 ENCRYPT the plan file before uploading (protects secrets in output)
      - name: Encrypt Terraform Plan
        run: |
          echo "${{ secrets.TF_GPG_PASSPHRASE }}" | \
          gpg --batch --yes --passphrase-fd 0 --symmetric --cipher-algo AES256 tfplan
          rm tfplan  # Remove unencrypted file

      - name: Upload Encrypted Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan.gpg
          retention-days: 1

  # ======================================================
  # 3. TERRAFORM APPLY (runs only on push to main – after merge)
  # ======================================================
  apply:
    name: Terraform Apply
    needs: plan
    if: github.actor != 'dependabot[bot]' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AZURE_CORE_COLLECT_TELEMETRY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.3"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      # Note: For simplicity, we re‑run `plan` here.
      # The encrypted artifact from the PR is not used in this basic setup.
      # To apply the *exact* reviewed plan, use a `workflow_run` trigger (see Advanced section below).
      - name: Terraform Plan (Merge Stage)
        run: terraform plan -out=tfmergeplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfmergeplan
