name: KICS

on:
  # 1. Called by parent workflows (e.g., your Terraform pipeline)
  workflow_call:
    inputs:
      image-version:
        description: "KICS image version"
        required: false
        default: "v1.6.10-alpine"          # ✅ Pinned for security & reproducibility
        type: string
      cloud-provider:
        description: "Cloud provider"
        required: false
        default: "azure"
        type: string
      gh_runner:
        description: "GitHub runner"
        required: false
        default: "ubuntu-latest"
        type: string

  # 2. Manual trigger via GitHub UI ("Run workflow" button)
  workflow_dispatch:
    inputs:
      image-version:
        description: "KICS image version"
        required: false
        default: "v1.6.10-alpine"
        type: string
      cloud-provider:
        description: "Cloud provider"
        required: false
        default: "azure"
        type: string
      gh_runner:
        description: "GitHub runner"
        required: false
        default: "ubuntu-latest"
        type: string

  # 3. Automatic trigger on PRs targeting your branch (adjust as needed)
  pull_request:
    branches:
      - newbranch1          # ⚠️ Change this to 'main' or your default branch if needed

jobs:
  kics:
    name: KICS Scan
    runs-on: ${{ inputs.gh_runner || 'ubuntu-latest' }}

    permissions:
      contents: read
      security-events: write
      # actions: read  ✅ REMOVED – not required (least privilege)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Uses PR merge commit for PRs, otherwise the current commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run KICS Scan
        uses: checkmarx/kics-github-action@v2
        with:
          path: .
          output_path: kics-results
          output_formats: sarif
          # ❌ REMOVED: ignore_on_exit: results
          # ✅ Added: Fails on HIGH or CRITICAL findings (exit code 1)
          fail_on: high
          verbose: true
          # ✅ Optional: Better visibility in PRs and job logs
          enable_jobs_summary: true
          enable_comments: true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: kics-results/results.sarif
          category: KICS

      - name: Upload KICS Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kics-results
          path: kics-results/
          retention-days: 1
