name: KICS

on:
  # =========================================================
  # Reusable workflow
  # =========================================================
  workflow_call:
    inputs:
      image-version:
        description: "KICS image version"
        required: false
        default: "v1.6.10-alpine"
        type: string

      cloud-provider:
        description: "Cloud provider"
        required: false
        default: "azure"
        type: string

      gh_runner:
        description: "GitHub runner"
        required: false
        default: "ubuntu-latest"
        type: string

  # =========================================================
  # Manual execution
  # =========================================================
  workflow_dispatch:
    inputs:
      image-version:
        description: "KICS image version"
        required: false
        default: "v1.6.10-alpine"
        type: string

      cloud-provider:
        description: "Cloud provider"
        required: false
        default: "azure"
        type: string

      gh_runner:
        description: "GitHub runner"
        required: false
        default: "ubuntu-latest"
        type: string


# ===========================================================
# Permissions
# ===========================================================
permissions:
  contents: read
  security-events: write


# ===========================================================
# Jobs
# ===========================================================
jobs:

  kics:
    name: KICS Scan

    runs-on: ${{ inputs.gh_runner || 'ubuntu-latest' }}

    steps:

      # -------------------------------------------------------
      # Checkout source code
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}


      # -------------------------------------------------------
      # Display scan information
      # -------------------------------------------------------
      - name: KICS Configuration
        shell: bash
        run: |
          echo "=================================================="
          echo "              KICS CONFIGURATION"
          echo "=================================================="
          echo ""
          echo "Cloud Provider : ${{ inputs.cloud-provider || 'azure' }}"
          echo "Runner         : ${{ inputs.gh_runner || 'ubuntu-latest' }}"
          echo "KICS Input Ver : ${{ inputs.image-version || 'v1.6.10-alpine' }}"
          echo "Failure Level  : HIGH"
          echo ""
          echo "=================================================="


      # -------------------------------------------------------
      # Run KICS
      #
      # IMPORTANT:
      # fail_on: high
      #
      # HIGH and CRITICAL findings fail the KICS scan.
      # MEDIUM / LOW / INFO do not fail the scan.
      # -------------------------------------------------------
      - name: Run KICS Scan
        id: kics
        uses: checkmarx/kics-github-action@v2
        with:
          path: .
          output_path: kics-results
          output_formats: sarif,json
          fail_on: high
          ignore_on_exit: none
          verbose: true
          enable_jobs_summary: true
          enable_comments: false


      # -------------------------------------------------------
      # Show KICS result files
      #
      # This runs even when KICS fails.
      # -------------------------------------------------------
      - name: KICS Result Files
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "              KICS RESULT FILES"
          echo "=================================================="
          echo ""

          if [ -d "kics-results" ]; then
            echo "KICS results directory exists."
            echo ""
            find kics-results -maxdepth 2 -type f -print
          else
            echo "KICS results directory was not generated."
          fi

          echo ""
          echo "=================================================="


      # -------------------------------------------------------
      # KICS Result Summary
      #
      # Do NOT calculate pass/fail here.
      # The KICS action itself determines pass/fail.
      # -------------------------------------------------------
      - name: KICS Result Summary
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "              KICS SCAN RESULT"
          echo "=================================================="
          echo ""

          if [ -f "kics-results/results.json" ]; then
            echo "KICS results.json generated successfully."
          else
            echo "WARNING: KICS results.json was not generated."
          fi

          if [ -f "kics-results/results.sarif" ]; then
            echo "KICS results.sarif generated successfully."
          else
            echo "WARNING: KICS results.sarif was not generated."
          fi

          echo ""
          echo "The KICS action above is responsible for determining"
          echo "the scan pass/fail status."
          echo ""
          echo "Configured failure threshold:"
          echo "  fail_on: high"
          echo ""
          echo "HIGH and CRITICAL findings block the pipeline."
          echo "MEDIUM, LOW and INFO findings do not block the pipeline."
          echo ""
          echo "=================================================="


      # -------------------------------------------------------
      # Add result information to GitHub Step Summary
      # -------------------------------------------------------
      - name: KICS GitHub Summary
        if: always()
        shell: bash
        run: |
          {
            echo "# KICS Scan"
            echo ""
            echo "## Configuration"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Failure threshold | \`high\` |"
            echo "| Cloud provider | \`${{ inputs.cloud-provider || 'azure' }}\` |"
            echo "| Runner | \`${{ inputs.gh_runner || 'ubuntu-latest' }}\` |"
            echo ""
            echo "## Result"
            echo ""
            echo "KICS scan output is available in the job logs and uploaded artifacts."
            echo ""
            echo "### Failure Policy"
            echo ""
            echo "- **CRITICAL** → Fail"
            echo "- **HIGH** → Fail"
            echo "- **MEDIUM** → Pass"
            echo "- **LOW** → Pass"
            echo "- **INFO** → Pass"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"


      # -------------------------------------------------------
      # Upload SARIF to GitHub Code Scanning
      #
      # Run even when KICS fails so findings are available.
      # -------------------------------------------------------
      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('kics-results/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: kics-results/results.sarif
          category: KICS


      # -------------------------------------------------------
      # Upload KICS results
      # -------------------------------------------------------
      - name: Upload KICS Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kics-results-${{ github.run_id }}
          path: kics-results/
          if-no-files-found: warn
          retention-days: 3