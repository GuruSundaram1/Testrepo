name: KICS

on:

  # =========================================================
  # REUSABLE WORKFLOW
  # =========================================================
  workflow_call:
    inputs:

      cloud-provider:
        description: "Cloud provider"
        required: false
        default: "azure"
        type: string

      gh_runner:
        description: "GitHub runner"
        required: false
        default: "ubuntu-latest"
        type: string


  # =========================================================
  # MANUAL EXECUTION
  # =========================================================
  workflow_dispatch:
    inputs:

      cloud-provider:
        description: "Cloud provider"
        required: false
        default: "azure"
        type: string

      gh_runner:
        description: "GitHub runner"
        required: false
        default: "ubuntu-latest"
        type: string


# ===========================================================
# PERMISSIONS
# ===========================================================
permissions:
  contents: read
  security-events: write


# ===========================================================
# JOBS
# ===========================================================
jobs:

  kics:
    name: KICS Scan

    runs-on: ${{ inputs.gh_runner || 'ubuntu-latest' }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}


      # =====================================================
      # KICS CONFIGURATION
      # =====================================================
      - name: KICS Configuration
        shell: bash
        run: |
          echo "=================================================="
          echo "              KICS CONFIGURATION"
          echo "=================================================="
          echo ""
          echo "KICS Action   : v2.1.20"
          echo "KICS Version  : 2.1.20"
          echo "Cloud Provider: ${{ inputs.cloud-provider || 'azure' }}"
          echo "Runner        : ${{ inputs.gh_runner || 'ubuntu-latest' }}"
          echo "Failure Level : HIGH"
          echo "Comments      : Disabled"
          echo "Annotations   : Disabled"
          echo ""
          echo "=================================================="


      # =====================================================
      # RUN KICS SCAN
      #
      # HIGH / CRITICAL findings cause the KICS action
      # to return a non-zero exit code.
      #
      # MEDIUM / LOW / INFO do not fail the pipeline.
      # =====================================================
      - name: Run KICS Scan
        id: kics
        uses: checkmarx/kics-github-action@v2.1.20
        with:

          # Directory to scan
          path: .

          # Output directory
          output_path: kics-results

          # Generate JSON and SARIF
          output_formats: sarif,json

          # Fail only on HIGH and CRITICAL
          fail_on: high

          # Do not ignore KICS result/error exit codes
          ignore_on_exit: none

          # Detailed KICS logs
          verbose: true

          # GitHub Actions job summary
          enable_jobs_summary: true

          # Disable PR comments
          enable_comments: false

          # IMPORTANT:
          # Disable GitHub annotations.
          # This avoids the post-scan annotation processing that
          # was followed by the Node/GLIBC error in your run.
          enable_annotations: false

          # Azure scanning
          cloud_provider: ${{ inputs.cloud-provider || 'azure' }}


      # =====================================================
      # KICS RESULT FILES
      #
      # Always execute this step so results can be inspected
      # even if the KICS scan fails.
      # =====================================================
      - name: KICS Result Files
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "              KICS RESULT FILES"
          echo "=================================================="
          echo ""

          if [ -d "kics-results" ]; then

            echo "KICS results directory exists."
            echo ""

            find kics-results -maxdepth 2 -type f -print

          else

            echo "KICS results directory was not generated."

          fi

          echo ""
          echo "=================================================="


      # =====================================================
      # KICS RESULT SUMMARY
      #
      # Do not attempt to parse results.json here.
      # The KICS action itself determines pass/fail using
      # fail_on: high.
      # =====================================================
      - name: KICS Result Summary
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "              KICS SCAN RESULT"
          echo "=================================================="
          echo ""

          if [ -f "kics-results/results.json" ]; then
            echo "KICS results.json generated successfully."
          else
            echo "WARNING: KICS results.json was not generated."
          fi

          if [ -f "kics-results/results.sarif" ]; then
            echo "KICS results.sarif generated successfully."
          else
            echo "WARNING: KICS results.sarif was not generated."
          fi

          echo ""
          echo "KICS failure threshold:"
          echo ""
          echo "  HIGH     -> FAIL"
          echo "  CRITICAL -> FAIL"
          echo "  MEDIUM   -> PASS"
          echo "  LOW      -> PASS"
          echo "  INFO     -> PASS"
          echo ""
          echo "The KICS action determines the actual job status."
          echo ""
          echo "=================================================="


      # =====================================================
      # GITHUB STEP SUMMARY
      # =====================================================
      - name: KICS GitHub Summary
        if: always()
        shell: bash
        run: |
          {
            echo "# KICS Scan"
            echo ""
            echo "## Configuration"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| KICS Action | \`v2.1.20\` |"
            echo "| Cloud Provider | \`${{ inputs.cloud-provider || 'azure' }}\` |"
            echo "| Failure Threshold | \`high\` |"
            echo "| PR Comments | Disabled |"
            echo "| Annotations | Disabled |"
            echo ""
            echo "## Failure Policy"
            echo ""
            echo "| Severity | Result |"
            echo "|---|---|"
            echo "| CRITICAL | ❌ Fail |"
            echo "| HIGH | ❌ Fail |"
            echo "| MEDIUM | ✅ Pass |"
            echo "| LOW | ✅ Pass |"
            echo "| INFO | ✅ Pass |"
            echo ""
            echo "KICS JSON and SARIF reports are uploaded as workflow artifacts."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"


      # =====================================================
      # UPLOAD SARIF TO CODE SCANNING
      #
      # Always attempt upload if SARIF exists.
      # =====================================================
      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('kics-results/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: kics-results/results.sarif
          category: KICS


      # =====================================================
      # UPLOAD KICS RESULTS
      # =====================================================
      - name: Upload KICS Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kics-results-${{ github.run_id }}
          path: kics-results/
          if-no-files-found: warn
          retention-days: 3